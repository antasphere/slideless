# The documented install path (Profile A: single VPS).
# Upgrade: docker compose pull && docker compose up -d
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/antasphere/slideless:latest}
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://slideless:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/slideless
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      # Optional dedicated user-content origin for share links (ADR 012).
      # Empty = same origin (the viewer stays under CSP: sandbox either way).
      - VIEWER_BASE_URL=${VIEWER_BASE_URL:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Versioned API-key peppers for secret rotation (internal/security-runbooks.md).
      - API_KEY_PEPPERS=${API_KEY_PEPPERS:-}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Break-glass superadmin allowlist (internal/security-runbooks.md). Empty = dormant.
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      # Orphaned-user cleanup grace in hours. Empty = default (72); 0 disables.
      - ORPHAN_USER_RETENTION_HOURS=${ORPHAN_USER_RETENTION_HOURS:-}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EMAIL_DRIVER=${EMAIL_DRIVER:-none}
      - SMTP_URL=${SMTP_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - REDIS_URL=${REDIS_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # Path-style addressing — required by MinIO and most S3-compatibles.
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      # Form file uploads by respondents: per-file MB (0 = off), files per
      # response, total MB per deck. Empty means the app defaults (100/100/5120).
      - FORMS_MAX_UPLOAD_MB=${FORMS_MAX_UPLOAD_MB:-}
      - FORMS_MAX_FILES_PER_RESPONSE=${FORMS_MAX_FILES_PER_RESPONSE:-}
      - FORMS_MAX_UPLOADS_MB_PER_DECK=${FORMS_MAX_UPLOADS_MB_PER_DECK:-}
      # Workspaces one person can own (any member can create another one from
      # the dashboard). Empty means the app default (10); 0 closes creation.
      - MAX_WORKSPACES_PER_USER=${MAX_WORKSPACES_PER_USER:-}
      # General per-principal API quota (requests/minute + 1s spike cap).
      # Empty means the app defaults (600 + 100); 0 disables consciously.
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-}
      - API_RATE_LIMIT_BURST=${API_RATE_LIMIT_BURST:-}
      # Enable ONLY behind a reverse proxy you control (Caddy). The app reads
      # the rightmost x-forwarded-for hop, so a spoofed one is ignored.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # /metrics is disabled (401) until this is set. setup.sh generates one.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Allow the first-boot wizard over plaintext HTTP on a non-loopback
      # origin. Default false: the owner password and the setup token would
      # cross the network in the clear.
      - ALLOW_INSECURE_SETUP=${ALLOW_INSECURE_SETUP:-false}
      # OTLP/HTTP endpoint for trace export. Unset = no export (zero phone-home).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The optional renderer container that makes the still image of each
      # deck version (docs/self-hosting/install.md, "Deck images"). Start it
      # with `docker compose --profile images up -d` (or COMPOSE_PROFILES=images
      # in .env) and set these two lines in .env; unset, the deck cards show
      # a drawn pattern and nothing else changes.
      - SLIDELESS_RENDERER_URL=${SLIDELESS_RENDERER_URL:-}
      - SLIDELESS_RENDERER_SECRET=${SLIDELESS_RENDERER_SECRET:-}
    ports:
      # LOOPBACK BY DEFAULT. Docker publishes ports by writing DNAT rules that
      # bypass ufw's INPUT chain, so a 0.0.0.0 bind here is reachable from the
      # internet no matter what the host firewall says — the documented `ufw`
      # step would be silently useless. Terminate TLS in a reverse proxy on
      # the host (docs/self-hosting/reverse-proxy.md) and leave this alone.
      # Deliberate exposure is an explicit opt-in: APP_BIND=0.0.0.0 in .env.
      # APP_PORT changes the HOST port only; in-container the app stays on
      # 3000 (the healthchecks depend on it).
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    read_only: true
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    # pgvector build of Postgres 17 so products needing embeddings work as-is.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=slideless
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=slideless
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Uncomment for local development (psql/drizzle against the compose db).
    # Loopback-only bind — never exposes Postgres beyond the host.
    # ports:
    #   - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slideless -d slideless']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The still-image renderer (PRDCT-2725): a sandboxed headless Chromium that
  # captures each deck version's first page, in its own container, under the
  # `images` profile. It holds no database and no storage: the app hands it a
  # job with a one-time key, it pulls the version's files from the app with
  # that key and puts the image back the same way, and the app behaves the
  # same when it is absent. No published port: it is reached on the compose
  # network only, at http://renderer:3100. Docker's default seccomp profile
  # forbids the user namespaces Chromium's own sandbox needs, so this service
  # runs under deploy/seccomp-chromium.json (that profile plus the namespace
  # calls); the renderer refuses to start without a working sandbox, and
  # never runs Chromium unsandboxed. Never replace it with seccomp=unconfined.
  renderer:
    image: ${RENDERER_IMAGE:-ghcr.io/antasphere/slideless-renderer:latest}
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    profiles: ['images']
    restart: unless-stopped
    # A capture in flight gets its 25 s to finish and answer before the kill.
    stop_grace_period: 30s
    environment:
      # Where the renderer reaches the app for the files and the image callback.
      - SLIDELESS_URL=http://app:3000
      - SLIDELESS_RENDERER_SECRET=${SLIDELESS_RENDERER_SECRET:?Set SLIDELESS_RENDERER_SECRET in .env to run the renderer}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    security_opt:
      - seccomp=./deploy/seccomp-chromium.json
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Optional services (uncomment when needed) ─────────────────────────────
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  #     - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  #   volumes:
  #     - minio_data:/data
  #
  # redis:
  #   image: redis:7-alpine
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']

volumes:
  pg_data:
  app_data:
  # minio_data:
