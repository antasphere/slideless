# The documented install path (Profile A: single VPS).
# Upgrade: docker compose pull && docker compose up -d
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/antasphere/slideless:latest}
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://slideless:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/slideless
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Versioned API-key peppers for secret rotation (docs/security.md).
      - API_KEY_PEPPERS=${API_KEY_PEPPERS:-}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Break-glass superadmin allowlist (docs/security.md). Empty = dormant.
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      # Orphaned-user cleanup grace in hours. Empty = default (72); 0 disables.
      - ORPHAN_USER_RETENTION_HOURS=${ORPHAN_USER_RETENTION_HOURS:-}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - EMAIL_DRIVER=${EMAIL_DRIVER:-none}
      - SMTP_URL=${SMTP_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - REDIS_URL=${REDIS_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # Path-style addressing — required by MinIO and most S3-compatibles.
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      # General per-principal API quota (requests/minute + 1s spike cap).
      # Empty means the app defaults (600 + 100); 0 disables consciously.
      - API_RATE_LIMIT_PER_MINUTE=${API_RATE_LIMIT_PER_MINUTE:-}
      - API_RATE_LIMIT_BURST=${API_RATE_LIMIT_BURST:-}
      # Enable ONLY behind a reverse proxy you control (Caddy). The app reads
      # the rightmost x-forwarded-for hop, so a spoofed one is ignored.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # /metrics is disabled (401) until this is set. setup.sh generates one.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # OTLP/HTTP endpoint for trace export. Unset = no export (zero phone-home).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # APP_PORT changes the HOST port only; in-container the app stays on
      # 3000 (the healthchecks depend on it).
      - '${APP_PORT:-3000}:3000'
    read_only: true
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    # pgvector build of Postgres 17 so products needing embeddings work as-is.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=slideless
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=slideless
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Uncomment for local development (psql/drizzle against the compose db).
    # Loopback-only bind — never exposes Postgres beyond the host.
    # ports:
    #   - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slideless -d slideless']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Optional services (uncomment when needed) ─────────────────────────────
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  #     - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  #   volumes:
  #     - minio_data:/data
  #
  # redis:
  #   image: redis:7-alpine
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']

volumes:
  pg_data:
  app_data:
  # minio_data:
