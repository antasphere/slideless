<!-- The Antasphere favicon: the woven-A mark on its creme tile, radius 14/64.

     GENERATED, not drawn here. It is `assetSvg('tile', 'light')` from
     src/lib/mark.js, which reads src/brand/mark-light.svg — the same function
     the Logo tab's tile download calls, so the tab and the browser tab cannot
     show different marks. To change it, change the base SVG and regenerate;
     never hand-edit the path below.

     It replaced the X-ray sphere, which the woven A retired in 2026-09 and
     which this file still carried. -->
