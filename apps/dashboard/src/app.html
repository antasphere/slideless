<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform</title>
    <style>
      /* Neutral boot splash: shown until the SPA has resolved instance +
         session (decision 11) — no dashboard chrome, no login flash. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfcfb;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e8e4df;
        border-top-color: #9ca3af;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash"><div class="spinner"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
