<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slideless</title>
    <script>
      // Theme boot: stored choice ?? system preference, applied before first
      // paint so neither splash nor app flashes the wrong ground. The class
      // drives tailwind's darkMode and the brand's dark token set alike.
      (function () {
        try {
          var stored = localStorage.getItem('slideless.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* privacy modes: fall through to light */
        }
      })();
    </script>
    <!-- The Observatory pairing, linked, never bundled: Sentient rides the
         Fontshare CDN (ITF FFL forbids redistributing the files); Onest and
         Sora (SIL OFL) ride Google Fonts. All have system-ui fallbacks. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@300,400,500&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300..600&family=Sora:wght@300&display=swap"
    />
    <style>
      /* Neutral boot splash: shown until the SPA has resolved instance +
         session (decision 11) — no dashboard chrome, no login flash. The
         grounds are the brand's paper, both themes. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0efec;
      }
      html.dark #splash {
        background: #141311;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #dcdbd6;
        border-top-color: #47799a;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      html.dark #splash .spinner {
        border-color: #33322e;
        border-top-color: #47799a;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash"><div class="spinner"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
