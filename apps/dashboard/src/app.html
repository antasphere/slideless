<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slideless</title>
    <!-- The tab icon (PRDCT-2401): the Antasphere tile, byte-identical to
         company/brand's, with its raster sizes from scripts/make-favicons.mjs.
         Same-origin static files under the existing CSP; the viewer hostname
         never serves them (host-gate.ts answers 404 outside its allowlist). -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <script>
      // Theme boot: stored choice ?? system preference, applied before first
      // paint so neither splash nor app flashes the wrong ground. The class
      // drives tailwind's darkMode and the brand's dark token set alike.
      (function () {
        try {
          var stored = localStorage.getItem('slideless.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* privacy modes: fall through to light */
        }
      })();
    </script>
    <!-- The Observatory pairing: Sentient (display) over Synonym (the second
         voice, one variable file, 200 to 700). Both ride the Fontshare CDN
         because this repo is public and the ITF FFL forbids
         putting the files on publicly accessible servers; private Antasphere
         repos self-host instead (company/brand README carries the rule).
         Product UI chrome only — never a face end users typeset their decks
         with. Onest (SIL OFL) rides Google Fonts. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=sentient@300,400,500&f[]=synonym@1&display=swap"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300..600&display=swap" />
    <style>
      /* Neutral boot splash: shown until the SPA has resolved instance +
         session (decision 11) — no dashboard chrome, no login flash. The
         grounds are the page field's base (tokens.css --field-base), both themes. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6ede3;
      }
      html.dark #splash {
        background: #241a12;
      }
      #splash .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e0daca;
        border-top-color: #c05e45;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      html.dark #splash .spinner {
        border-color: #3e362e;
        border-top-color: #db7d5f;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash"><div class="spinner"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
