name: CI

on:
  push:
    # Slideless follows the workspace branch model: prod (default, deploys)
    # + dev (day-to-day). The template's main-only trigger would never fire.
    branches: [prod, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test build
      - run: pnpm format:check
      - run: pnpm --filter @slideless/server drift:check

  # The hub–tool wire check (PRDCT-2677): the hub owns the messages the tools
  # exchange with it (the usage event and batch, the ingest result, the
  # entitlements answer, the check request and answer) and publishes them as
  # ONE generated snapshot, packages/contract/wire/hub-tool-messages.json.
  # This job reads that file from the hub's dev, rebuilds the same snapshot
  # from the chassis's copies (packages/chassis-contract/src/wire.ts, the
  # hub's builder copied verbatim) on the hub's own probe inputs, and fails
  # on any difference, each named by its path. It runs ONE way: a hub change
  # lands first, this job goes red until the chassis follows, in
  # packages/chassis-contract/src/entitlements.ts. The hub is private: the
  # token is minted from the same GitHub App as the federation drill's
  # (contents:read on antasphere/hub), and only the one file is checked out.
  hub-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: hub-checkout
        with:
          app-id: ${{ secrets.FEDERATION_DRILL_APP_ID }}
          private-key: ${{ secrets.FEDERATION_DRILL_APP_KEY }}
          owner: antasphere
          repositories: hub
      - uses: actions/checkout@v4
        with:
          repository: antasphere/hub
          ref: dev
          token: ${{ steps.hub-checkout.outputs.token }}
          path: .hub-wire
          sparse-checkout: packages/contract/wire/hub-tool-messages.json
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @antasphere/chassis-contract build
      - name: Compare the chassis's copies with the hub's wire snapshot
        run: HUB_WIRE_SNAPSHOT=$GITHUB_WORKSPACE/.hub-wire/packages/contract/wire/hub-tool-messages.json pnpm --filter @antasphere/chassis-contract wire:check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@slideless/db --filter=@slideless/server --filter=@antasphere/slideless
      - run: pnpm turbo test:integration

  hostinger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/hostinger-template.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build image for Hostinger rehearsal
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: slideless:hostinger-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise HTTPS installation and persistence
        env:
          HOSTINGER_TEST_IMAGE: slideless:hostinger-test
        run: node scripts/hostinger-smoke.mjs
      # This verifies the exact artifact used by customers, independently of
      # the checkout build above. Public publication separately requires
      # anonymous pulls; this login lets CI test it before visibility changes.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise the pinned distribution image
        run: node scripts/hostinger-smoke.mjs

  # The Profile B rehearsal: a real multi-replica stack (advisory-lock
  # migration race, cross-replica sessions/API keys, Redis-shared rate
  # limits + the in-memory contrast, the api/worker SERVICE_ROLE split).
  # Same script as the local drill — docs/operations/scaling.md.
  scale-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the drill image once (all replicas share it)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: slideless:scale
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the multi-replica scale drill
        run: DRILL_SKIP_BUILD=1 ./scripts/scale-drill.sh

  # The federation drill (PRDCT-1370): the hub AND this Slideless checkout in
  # one compose project, a headless SSO login, then assertions on the HUB's
  # database — the only place the grant-family consequences are visible.
  # internal/federation.md "The federation drill". The hub is checked out
  # beside this repo (its dev branch) and built by the compose file; the
  # checkout needs a token that can read antasphere/hub
  # (minted per run by the antasphere-federation-drill GitHub App, which has
  # contents:read on antasphere/hub).
  federation-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hub is private: mint a short-lived token from the
      # antasphere-federation-drill GitHub App (contents:read on antasphere/hub)
      # rather than carry a personal token that expires every 90 days.
      - uses: actions/create-github-app-token@v1
        id: hub-checkout
        with:
          app-id: ${{ secrets.FEDERATION_DRILL_APP_ID }}
          private-key: ${{ secrets.FEDERATION_DRILL_APP_KEY }}
          owner: antasphere
          repositories: hub
      - uses: actions/checkout@v4
        with:
          repository: antasphere/hub
          ref: dev
          token: ${{ steps.hub-checkout.outputs.token }}
          path: .federation-hub
      - uses: docker/setup-buildx-action@v3
      - name: Build the Slideless image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: slideless:federation-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the hub image
        uses: docker/build-push-action@v6
        with:
          context: .federation-hub
          load: true
          tags: antasphere-hub:federation-dev
          cache-from: type=gha,scope=federation-hub
          cache-to: type=gha,mode=max,scope=federation-hub
      - name: Run the federation drill
        run: FEDERATION_HUB_DIR=$PWD/.federation-hub DRILL_SKIP_BUILD=1 ./scripts/federation-drill.sh
